version: '3.8'

services:
  watermark-qim:
    build: .
    container_name: watermark-qim
    stdin_open: true  # Pour l'interactivité
    tty: true
    volumes:
      # Monter un dossier local pour les images
      - ./images:/app/images      # Dossier pour images d'entrée
      - ./output:/app/output      # Dossier pour résultats
      - ./results:/app/results    # Dossier pour graphiques
    environment:
      - DISPLAY=${DISPLAY}        # Pour l'affichage graphique (optionnel)
    working_dir: /app
    # Pour l'affichage X11 (Linux uniquement)
    network_mode: host
    
  # Version avec interface GUI (si besoin)
  watermark-gui:
    build: .
    container_name: watermark-gui
    command: python gui_watermark.py
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro  # Pour X11 forwarding
      - ./images:/app/images
      - ./output:/app/output
    network_mode: host